[build]
  command = "npm run build"
  publish = "dist"

# Map the app's clean routes to the built HTML pages
[[redirects]]
  from = "/login"
  to = "/Login.html"
  status = 200

[[redirects]]
  from = "/scanner"
  to = "/Scanner.html"
  status = 200

[[redirects]]
  from = "/analysis"
  to = "/Analysis.html"
  status = 200

[[redirects]]
  from = "/explanation"
  to = "/Explanation.html"
  status = 200

[[redirects]]
  from = "/user-profile"
  to = "/User.html"
  status = 200

[[redirects]]
  from = "/code"
  to = "/code.html"
  status = 200
